<button
  [disabled]="disabled()"
  [type]="'button'"
  [class]="`
    relative overflow-hidden w-full rounded-md p-4
    font-bold md:text-lg text-white
    transition-opacity duration-200 brightness-110 md:hover:brightness-125
    bg-[radial-gradient(circle,var(--primary-dim)_40%,var(--primary-bright)_100%)]
    ${additionalClasses()}
    ${disabled() ? 'opacity-50 cursor-not-allowed pointer-events-none' : ''}
  `"
>
  <span class="relative z-10 flex items-center justify-center gap-2">
    <ng-content></ng-content>
  </span>
</button>
