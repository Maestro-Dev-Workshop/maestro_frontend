<!-- 1. Background Layer: Force it to stay strictly in the deep background -->
<div class="fixed inset-0 z-0">
  <app-auth-background></app-auth-background>
</div>

<!-- 2. Overlay Container Layer: Full screen invisible window that perfectly handles layout centering -->
<div class="fixed inset-0 z-10 flex items-center justify-center p-4 overflow-y-auto">
  <!-- 3. The Card Content Layer: Give this explicit constraints so it cannot expand past standard sizing -->
  <div class="w-full max-w-[577px] bg-[var(--background)] rounded-2xl shadow-xl py-16 px-8 flex flex-col">
    
    <!-- Header -->
     <img
        src="{{ logoSrc() }}"
        alt="Maestro Logo"
        class="w-12 mr-2"
    />

    <h1 class="mt-4 mb-4 text-2xl text-[var(--on-background)] mb-2">
      Password Reset
    </h1>

    <p class="mb-6 text-base text-[var(--on-surface-variant)] mb-2">
      Enter your email address here and we will send you a link to reset your password.
    </p>

    <form class="w-full" #form="ngForm" (ngSubmit)="onSubmit()">
      <!-- Email Input -->
      <div class="flex flex-col mb-6 font-normal">
        <!-- <label class="text-[var(--on-surface)] mb-2 text-sm">Email Address</label> -->
        <input
          type="email"
          name="email"
          placeholder="Email"
          class="bg-[var(--background)] p-4 rounded-md text-[var(--on-surface-variant)] border border-[var(--outline)] focus:border-[var(--outline-variant)] outline-none transition"
          [(ngModel)]="email"
          required
          email
          #emailCtrl="ngModel"
        />
        <!-- Error messages -->
        @if (emailCtrl.invalid && emailCtrl.touched) {
          <div class="text-red-500 text-sm mt-1">
            @if (emailCtrl.errors?.["required"]) {
              <span>Email is required</span>
            }
            @if (emailCtrl.errors?.["email"]) {
              <span>Invalid email format</span>
            }
          </div>
        }
        </div>
      <!-- Button -->
      <app-shiny-btn
        class="w-full"
        type="submit"
        [disabled]="loading"
    >

        Send
        <img
          src="images/spinner.gif"
          alt=""
          [class]="
            `absolute right-4 top-4 w-6 h-6 ${loading ? '' : 'hidden'}`
          "
        />
      </app-shiny-btn>
     
    </form>

  </div>
</div>
