<div class="w-screen h-screen flex flex-col overflow-hidden">
  <app-header></app-header>

  <div class="relative w-full flex flex-row flex-1 overflow-hidden">
    <app-dashboard-sidebar
      class="absolute md:relative h-full flex-shrink-0"
      currentPage="Settings"
    ></app-dashboard-sidebar>

    <section class="flex-1 overflow-y-auto overflow-x-hidden p-8">
      <div class="max-w-4xl mx-auto">
        <div class="flex items-center gap-3 mb-8">
          <h1 class="text-4xl font-medium text-on-surface">Settings</h1>
          <app-theme-icon
            name="gear-icon"
            className="w-8 h-8 text-on-surface"
          ></app-theme-icon>
        </div>

        <div class="bg-surface-container-high rounded-xl p-6 mb-6">
          <p class="text-sm mb-6">
            <span class="text-on-surface">Signed in as </span>
            <span class="text-primary font-medium">test@example.com</span>
          </p>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
            <div>
              <div class="flex justify-between items-center mb-2">
                <label class="text-xs font-medium text-on-surface"
                  >First Name</label
                >
                <app-theme-icon
                  name="edit-icon"
                  className="w-4 h-4 text-on-surface"
                ></app-theme-icon>
              </div>
              <input
                type="text"
                [(ngModel)]="firstName"
                placeholder="First Name"
                class="w-full p-3 rounded-lg border border-outline bg-surface text-on-surface placeholder-on-surface-variant focus:outline-none focus:border-primary"
              />
            </div>
            <div>
              <div class="flex justify-between items-center mb-2">
                <label class="text-xs font-medium text-on-surface"
                  >Last Name</label
                >
                <app-theme-icon
                  name="edit-icon"
                  className="w-4 h-4 text-on-surface"
                ></app-theme-icon>
              </div>
              <input
                type="text"
                [(ngModel)]="lastName"
                placeholder="Last Name"
                class="w-full p-3 rounded-lg border border-outline bg-surface text-on-surface placeholder-on-surface-variant focus:outline-none focus:border-primary"
              />
            </div>
          </div>

          <div class="flex justify-start gap-2 mb-8">
            <button
              class="bg-primary text-on-primary px-4 py-2 rounded-md text-sm hover:opacity-90 transition-opacity shadow-[inset_0_6px_12px_-2px_rgba(255,255,255,0.25)]"
              (click)="savePersonalInfo()"
            >
              Save
            </button>
            <button
              class="bg-primary-container text-on-primary-container px-4 py-2 rounded-md text-sm hover:opacity-90 transition-opacity shadow-[inset_0_6px_12px_-2px_rgba(255,255,255,0.25)]"
              (click)="firstName = 'John'; lastName = 'Doe'"
            >
              Cancel
            </button>
          </div>

          <div class="border-t border-outline-variant mb-6"></div>

          <h3 class="text-sm font-semibold text-primary underline mb-4">
            Change Password
          </h3>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
            <div>
              <label class="block text-xs font-medium text-on-surface mb-2"
                >Current Password</label
              >
              <input
                type="password"
                [(ngModel)]="currentPassword"
                placeholder="Current Password"
                class="w-full p-3 rounded-lg border border-outline bg-surface text-on-surface placeholder-on-surface-variant focus:outline-none focus:border-primary"
              />
            </div>
            <div>
              <label class="block text-xs font-medium text-on-surface mb-2"
                >New Password</label
              >
              <input
                type="password"
                [(ngModel)]="newPassword"
                placeholder="New Password"
                class="w-full p-3 rounded-lg border border-outline bg-surface text-on-surface placeholder-on-surface-variant focus:outline-none focus:border-primary"
              />
            </div>
          </div>

          <div class="mb-4">
            <label class="block text-xs font-medium text-on-surface mb-2"
              >Confirm New Password</label
            >
            <input
              type="password"
              [(ngModel)]="confirmPassword"
              placeholder="New Password"
              class="w-full p-3 rounded-lg border border-outline bg-surface text-on-surface placeholder-on-surface-variant focus:outline-none focus:border-primary"
            />
          </div>

          <div class="flex justify-end gap-2">
            <button
              class="bg-primary text-on-primary px-4 py-2 rounded-md text-sm hover:opacity-90 transition-opacity shadow-[inset_0_6px_12px_-2px_rgba(255,255,255,0.25)]"
              (click)="savePassword()"
            >
              Save
            </button>
            <button
              class="bg-primary-container text-on-primary-container px-4 py-2 rounded-md text-sm hover:opacity-90 transition-opacity shadow-[inset_0_6px_12px_-2px_rgba(255,255,255,0.25)]"
              (click)="
                currentPassword = ''; newPassword = ''; confirmPassword = ''
              "
            >
              Cancel
            </button>
          </div>
        </div>

        <div class="bg-surface-container-high rounded-xl p-6 mb-6">
          <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-2">
              <span class="text-sm font-medium text-on-surface">Theme: </span>
              <span class="text-primary font-medium">
                {{
                  themeService.effectiveTheme() === "dark" ? "Dark" : "Light"
                }}
              </span>
              <app-theme-icon
                name="theme-icon"
                className="w-4 h-4 text-primary"
              ></app-theme-icon>
            </div>

            <div class="flex items-center gap-2">
              <app-theme-icon
                name="themel-icon"
                className="w-4 h-4 text-on-surface"
              ></app-theme-icon>
              <button
                class="w-12 h-6 rounded-full relative transition-colors duration-300 bg-surface border border-outline-variant"
                (click)="toggleTheme()"
                aria-label="Toggle Theme"
              >
                <div
                  class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-primary transition-all duration-300"
                  [ngClass]="{
                    'translate-x-6': themeService.effectiveTheme() === 'dark',
                  }"
                ></div>
              </button>
              <app-theme-icon
                name="themed-icon"
                className="w-4 h-4 text-on-surface"
              ></app-theme-icon>
            </div>
          </div>

          <div class="border-t border-outline-variant mb-6"></div>

          <!-- Membership -->
          <div class="flex justify-between items-center">
            <span class="text-sm font-medium text-on-surface"
              >Membership: Free Tier</span
            >
            <button
              class="bg-primary text-on-primary px-4 py-2 rounded-md text-sm hover:opacity-90 transition-opacity shadow-[inset_0_6px_12px_-2px_rgba(255,255,255,0.25)]"
              (click)="viewDetails()"
            >
              View Details
            </button>
          </div>
        </div>

        <div class="flex justify-end">
          <button
            class="bg-error-container text-on-error-container px-4 py-2 rounded-md text-sm font-medium flex items-center gap-2 hover:opacity-90 transition-opacity"
            (click)="logout()"
          >
            <app-theme-icon
              name="logout-icon"
              className="w-4 h-4"
            ></app-theme-icon>
            Logout
          </button>
        </div>
      </div>
    </section>
  </div>
</div>
