<div class="w-screen h-screen flex flex-col overflow-hidden">
  <app-header></app-header>

  <div class="relative w-full flex flex-row flex-1 overflow-hidden">
    <app-dashboard-sidebar
      class="absolute md:relative h-full flex-shrink-0 z-20"
      currentPage="Settings"
    ></app-dashboard-sidebar>

    <section class="flex-1 overflow-y-auto overflow-x-hidden p-8 z-10 custom-scrollbar">
      <div class="w-full mx-auto">
        <div class="flex items-center gap-2 md:gap-4 mb-8">
          <h1 class="text-3xl md:text-4xl font-medium text-on-surface">Settings</h1>
          <app-theme-icon
            name="gear-icon"
            className="w-8 h-8 text-on-surface"
          ></app-theme-icon>
        </div>

        <div class="bg-surface-container-high rounded-xl p-6 mb-6">
          <p class="text-sm md:text-base mb-6">
            <span class="text-on-surface">Signed in as </span>
            <span class="text-primary font-medium">test@example.com</span>
          </p>

          <!-- Name Settings -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
            <div>
              <div class="flex justify-between items-center mb-2">
                <label class="text-sm md:text-base font-medium"
                  >First Name</label
                >
                <app-theme-icon
                  name="edit-icon"
                  className="w-4 h-4"
                  class="cursor-pointer md:hover:opacity-60"
                  (click)="toggleNameEdit()"
                ></app-theme-icon>
              </div>
              <input
                type="text"
                [(ngModel)]="firstName"
                [disabled]="!isEditingName()"
                placeholder="First Name"
                class="w-full p-3 rounded-lg border border-outline bg-surface text-sm placeholder-on-surface-variant 
                focus:outline-none focus:border-primary disabled:opacity-60"
              />
            </div>
            <div>
              <div class="flex justify-between items-center mb-2">
                <label class="text-sm md:text-base font-medium"
                  >Last Name</label
                >
                <app-theme-icon
                  name="edit-icon"
                  className="w-4 h-4"
                  class="cursor-pointer md:hover:opacity-60"
                  (click)="toggleNameEdit()"
                ></app-theme-icon>
              </div>
              <input
                type="text"
                [(ngModel)]="lastName"
                [disabled]="!isEditingName()"
                placeholder="Last Name"
                class="w-full p-3 rounded-lg border border-outline bg-surface text-sm placeholder-on-surface-variant 
                focus:outline-none focus:border-primary disabled:opacity-60"
              />
            </div>
          </div>

          @if (isEditingName()) {
            <div class="flex justify-start gap-2 mb-8">
              <app-standard-btn
                [disabled]="!canSaveName()"
                (click)="savePersonalInfo()"
              >
                Save
              </app-standard-btn>
              <app-standard-btn
                flavour="alt"
                (click)="cancelNameEdit()"
              >
                Cancel
              </app-standard-btn>
            </div>
          }

          <div class="border-t border-outline-variant mb-6"></div>

          <button
            class="text-sm font-semibold text-primary underline mb-4"
            (click)="togglePasswordFields()"
          >
            Change Password
          </button>

          <!-- Password Settings -->
          @if (showPasswordFields()) {
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
              <div>
                <label class="block text-sm md:text-base font-medium text-on-surface mb-2"
                  >Current Password</label
                >
                <input
                  type="password"
                  [(ngModel)]="currentPassword"
                  placeholder="Current Password"
                  class="w-full p-3 rounded-lg border border-outline bg-surface text-sm placeholder-on-surface-variant focus:outline-none focus:border-primary"
                />
              </div>
              <div>
                <label class="block text-sm md:text-base font-medium text-on-surface mb-2"
                  >New Password</label
                >
                <input
                  type="password"
                  [(ngModel)]="newPassword"
                  placeholder="New Password"
                  class="w-full p-3 rounded-lg border border-outline bg-surface text-sm placeholder-on-surface-variant focus:outline-none focus:border-primary"
                />
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4 items-end">
              <div>
                <label class="block text-sm md:text-base font-medium text-on-surface mb-2"
                  >Confirm New Password</label
                >
                <input
                  type="password"
                  [(ngModel)]="confirmPassword"
                  placeholder="New Password"
                  class="w-full p-3 rounded-lg border border-outline bg-surface text-sm placeholder-on-surface-variant focus:outline-none focus:border-primary"
                />
              </div>
              <div class="flex justify-end gap-2">
                <app-standard-btn (click)="savePassword()">
                  Save
                </app-standard-btn>
                <app-standard-btn 
                  flavour="alt"
                  (click)="currentPassword = ''; newPassword = ''; confirmPassword = ''; togglePasswordFields()"
                >
                  Cancel
                </app-standard-btn>
              </div>
            </div>

          }
        </div>

        <div class="bg-surface-container-high rounded-xl p-6 mb-6">
          <!-- Theme Settings -->
          <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-2">
              <span class="md:text-xl font-medium text-on-surface">Theme: </span>
              <span class="md:text-xl text-primary font-medium">
                {{
                  themeService.effectiveTheme() === "dark" ? "Dark" : "Light"
                }}
              </span>
              <app-theme-icon
                name="theme-icon"
                className="w-4 h-4 text-primary"
              ></app-theme-icon>
            </div>

            <div class="flex items-center gap-2">
              <app-theme-icon
                name="themel-icon"
                className="w-4 h-4 text-on-surface"
              ></app-theme-icon>
              <button
                class="w-14 rounded-full relative transition-colors p-1 duration-300 bg-surface border border-outline-variant"
                (click)="toggleTheme()"
                aria-label="Toggle Theme"
              >
                <div
                  class="w-5 h-5 rounded-full bg-primary transition-all duration-300"
                  [ngClass]="{
                    'translate-x-6': themeService.effectiveTheme() === 'dark',
                  }"
                ></div>
              </button>
              <app-theme-icon
                name="themed-icon"
                className="w-4 h-4 text-on-surface"
              ></app-theme-icon>
            </div>
          </div>

          <div class="border-t border-outline-variant mb-6"></div>

          <!-- Membership -->
          <div class="flex justify-between items-center">
            <span class="md:text-xl font-medium text-on-surface"
              >Membership: {{ membershipTier }}</span
            >
            <app-standard-btn (click)="viewDetails()">
              View Details
            </app-standard-btn>
          </div>
        </div>

        <div class="flex justify-end">
          <app-standard-btn
            className="!bg-error-container !text-on-error-container"
            leftIcon="logout-icon"
            (click)="logout()"
          >
            Logout
          </app-standard-btn>
        </div>
      </div>
    </section>
  </div>
</div>
