<div class="w-screen h-screen flex flex-col bg-surface">
  <app-header></app-header>
  <div class="relative w-full flex flex-row flex-1">
    <app-dashboard-sidebar class="absolute md:relative h-full" currentPage="Credit Store"></app-dashboard-sidebar>
    <section class="flex-1 overflow-y-auto p-8 bg-surface">
      
      <div class="flex justify-center mb-8">
        <div class="bg-surface-container rounded-full p-1 flex gap-1 shadow-sm">
          <button 
            class="px-6 py-2 rounded-full text-sm font-medium transition-colors"
            [class]="!showMemberships() ? 'bg-surface text-on-surface' : 'bg-primary-container text-on-primary-container'"
            (click)="showMemberships.set(false)">
            Credits
          </button>
          <button 
            class="px-6 py-2 rounded-full text-sm font-medium transition-colors"
            [class]="showMemberships() ? 'bg-surface text-on-surface' : 'bg-primary-container text-on-primary-container'"
            (click)="showMemberships.set(true)">
            Memberships
          </button>
        </div>
      </div>

      <div class="flex flex-col items-center mb-8 text-center">
        <h1 class="text-3xl font-medium text-on-surface mb-2">
          @if (showMemberships()) {
            Want more from Maestro? Become a member.
          } @else {
            Need further study? We've got you covered.
          }
        </h1>
      </div>

      @if (!showMemberships()) {
        <app-credits />
      } @else {
        <app-memberships />
      }

    </section>
  </div>
</div>
