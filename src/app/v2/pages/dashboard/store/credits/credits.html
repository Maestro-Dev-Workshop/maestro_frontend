<div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto">
  @for (pack of creditPacks; track pack) {
    <div class="bg-surface-container rounded-xl border-2 border-transparent hover:border-[#317AC3] shadow-[4px_4px_8px_rgba(0,0,0,0.25)] hover:shadow-[8px_8px_16px_4px_rgba(49,122,195,0.25)] transition-all p-6 relative overflow-hidden">
      <div class="flex justify-between items-start relative z-10">
        <div class="flex items-center gap-2">
          <app-theme-icon name="credits-icon" className="w-5 h-5 text-on-surface"></app-theme-icon>
          <span class="text-xl font-semibold text-on-surface">{{ pack.credits }}</span>
          @if (pack.bonusCredits) {
            <span class="text-sm text-on-surface-variant">{{ pack.bonusCredits }}</span>
          }
        </div>
        <div class="text-right flex items-baseline justify-end gap-1">
          @if (pack.oldPrice) {
            <span class="text-xs text-on-surface-variant line-through">{{ pack.oldPrice }}</span>
          }
          <span class="text-2xl font-bold text-on-surface">{{ pack.price }}</span>
        </div>
      </div>
      <p class="text-sm text-on-surface-variant mt-2 mb-10 relative z-10">{{ pack.desc }}</p>

      <div class="pack-gradient">
        @if (pack.bonus) {
          <span class="absolute bottom-4 left-4 text-xs bg-primary-container text-on-primary-container px-2 py-1 rounded">Bonus Credits</span>
        }
        @if (pack.discount) {
          <span class="absolute bottom-4 left-4 text-xs bg-primary-container text-on-primary-container px-2 py-1 rounded">{{ pack.discount }}</span>
        }
      </div>

      <div class="relative z-10 flex justify-end pr-4 pb-4">
        <app-shiny-btn>Purchase</app-shiny-btn>
      </div>
    </div>
  }
</div>
