@if (show) {
  <div
    class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50"
    (click)="confirm(false)"
  >
    <div
      class="bg-surface-container rounded-2xl p-6 max-w-sm md:max-w-md w-full shadow-lg flex flex-col items-center  gap-3 md:gap-4"
      (click)="$event.stopPropagation()"
    >
      <app-theme-icon name="help-circle-icon" className="w-12 md:w-14" class="mb-2 md:mb-4"></app-theme-icon>
      <h3 class="text-2xl md:text-3xl font-medium text-on-surface">{{options.title}}</h3>
      <p class="text-sm md:text-base text-on-surface-variant">{{options.message}}</p>
      <div class="flex justify-end w-full items-center gap-2">
        <app-standard-btn
          (click)="confirm(true)"
        >
          {{options.okText}}
        </app-standard-btn>
        <app-standard-btn
          flavour="alt"
          (click)="confirm(false)"
        >
          {{options.cancelText}}
        </app-standard-btn>
      </div>
    </div>
  </div>
}
